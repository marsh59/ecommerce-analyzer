<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Analyzer</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1> E-Commerce Performance Analyzer</h1>

    <div class="card">
        <h2>📂 Upload Dataset</h2>
        <input type="file" id="file">
        <button onclick="uploadFile()">Upload</button>
        <p id="status"></p>
    </div>

    <div class="card">
        <h2>📊 Dashboards</h2>
        <a href="/sales"><button>💰 Sales Dashboard</button></a>
        <a href="/products"><button>📦 Product Dashboard</button></a>
        <a href="/customers"><button>👤 Customer Dashboard</button></a>
    </div>

</div>

<script>
function uploadFile() {
    let file = document.getElementById("file").files[0];
    let formData = new FormData();
    formData.append("file", file);

    fetch('/upload', { method: 'POST', body: formData })
    .then(res => res.json())
    .then(data => {
        document.getElementById("status").innerText = data.message;
    });
}
</script>

</body>
</html>
